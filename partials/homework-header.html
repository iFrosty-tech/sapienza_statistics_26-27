<div class="sheet-head sheet-head--compact">
        <div class="sheet-strip">
          <!-- @phi-strip -->
          <p class="sheet-strip__no">Sheet <span class="field__figure">HW-{{hw.no}}</span></p>
        </div>
        <!-- @include partials/identity-block.html -->
      </div>

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="{{base}}#register">Homework register</a></li>
          <li><span aria-current="page">Homework&nbsp;<span class="field__figure">{{hw.no}}</span></span></li>
        </ol>
      </nav>

      <header class="hw-head">
        <h1 class="hw-head__title">
          <span class="hw-head__no"><span class="visually-hidden">Homework </span><span class="field__figure">{{hw.no}}</span></span>
          <span class="hw-head__text">{{hw.title}}</span>
        </h1>
        <dl class="hw-head__meta">
          <div>
            <dt>Date</dt>
            <dd><time datetime="{{hw.published}}">{{hw.publishedLabel}}</time></dd>
          </div>
          <div>
            <dt>Topics</dt>
            <dd>{{hw.topics}}</dd>
          </div>
          <div>
            <dt>Author</dt>
            <dd>{{site.author}}</dd>
          </div>
        </dl>
        <p class="hw-head__abstract"><span class="hw-head__abstract-label">Abstract.</span> {{hw.abstract}}</p>
      </header>
